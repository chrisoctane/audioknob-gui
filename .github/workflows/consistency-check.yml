name: Consistency Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff against base
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libraries (Qt runtime)
        run: |
          sudo apt-get update
          # PySide6 wheels need system EGL/OpenGL libs available at import-time.
          sudo apt-get install -y libegl1 libgl1
      
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -e .
      
      - name: Run CI quality gate (G1 + G2)
        run: python3 scripts/run_quality_gate.py --gate ci
