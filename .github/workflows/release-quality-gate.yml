name: Release Quality Gate

on:
  push:
    tags:
      - "v*"

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries (Qt runtime)
        run: |
          sudo apt-get update
          # PySide6 wheels need system EGL/OpenGL libs available at import-time.
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -e .

      - name: Run release quality gate (G3)
        run: python3 scripts/run_quality_gate.py --gate g3 --release-version "${GITHUB_REF_NAME}"
